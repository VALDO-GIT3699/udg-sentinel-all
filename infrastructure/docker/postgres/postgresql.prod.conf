# ============================================================
# PostgreSQL 16 — Configuración de PRODUCCIÓN para UDG Sentinel
# ============================================================
# Referenciado por docker-compose.prod.yml (servicio "db"). Los valores de
# memoria de abajo son un punto de partida conservador para un servidor
# pequeño/mediano (2-4 GB de RAM dedicados a Postgres); ajústalos con el
# hardware real del servidor (regla general: shared_buffers ~25% de la RAM
# del contenedor, effective_cache_size ~50-75%).
# ============================================================

# ── Conexiones ────────────────────────────────────────────
listen_addresses = '*'
max_connections = 100

# ── Memoria ───────────────────────────────────────────────
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# ── WAL / durabilidad ─────────────────────────────────────
# full_page_writes en "on" (default) es lo seguro ante un corte de energía;
# no se desactiva aquí a propósito.
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# ── Planificador ──────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200

# ── Registro (logs) ───────────────────────────────────────
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '

# ── SSL ───────────────────────────────────────────────────
# La conexión app→db viaja dentro de la red interna de Docker
# (sentinel_network), no expuesta al host ni a internet; se deja apagado
# aquí. Si en algún momento Postgres queda accesible fuera de esa red
# interna, esto debe activarse.
ssl = off

# ── Autovacuum ────────────────────────────────────────────
autovacuum = on
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
